<!DOCTYPE html>
<html>
<head>
  <title>HeatPace</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- ✅ Load Chart.js globally (IMPORTANT) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <div class="container">

    <!-- LEFT: INPUT -->
    <div class="card">
      <h1>🔥 HeatPace</h1>

      <input id="pace" placeholder="Pace (sec/km)" />
      <input id="temp" placeholder="Temperature (°F)" />

      <button onclick="calculate()">Predict</button>

      <div id="result">Enter values</div>
    </div>

    <!-- RIGHT: CHART -->
    <div class="card">
      <h2>Temperature vs Pace</h2>
      <canvas id="chart"></canvas>
    </div>

  </div>

  <!-- Your app -->
  <script type="module" src="./js/app.js"></script>

</body>
</html>
