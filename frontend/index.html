<!DOCTYPE html>
<html>
<head>
  <title>HeatPace</title>
  <link rel="stylesheet" href="css/styles.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <div class="container">
    <div class="card">
      <img src="./assets/logo.jpg" alt="HeatPace" class="logo" />

      <input id="pace" placeholder="Pace (mm:ss / mile)" />
      <input id="temp" placeholder="Temperature (°F)" />

      <button onclick="calculate()">Predict</button>
      <button onclick="connectStrava()">Connect Strava</button>
      <button class="demo-toggle" onclick="toggleMock()">D</button>
      

      <div id="result">Enter values</div>
    </div>
    <div class="card">
      <h2>My Strava Heat Performance</h2>
      <canvas id="chart"></canvas>
    </div>

  </div>

  <script type="module" src="./js/app.js"></script>

</body>
</html>
